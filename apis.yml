aid: moondream
name: Moondream
description: >-
  Moondream is a fast, efficient open vision language model (VLM) from M87 Labs.
  The Moondream Cloud API turns images into structured output through five Skills —
  Query (visual question answering), Caption, Detect (bounding boxes), Point (center
  coordinates), and Segment (SVG path masks) — plus an OpenAI-compatible chat
  endpoint, an asynchronous Batch API, and cloud finetuning (Lens). Model weights
  are open and downloadable from Hugging Face; hosted inference is pay-per-token
  with HIPAA and SOC 2 available. Official Python and Node.js SDKs are published.
