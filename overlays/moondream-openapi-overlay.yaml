overlay: 1.0.0
info:
  title: API Evangelist enhancements for Moondream Cloud API
  version: 1.0.0
extends: openapi/moondream-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 3
      x-apievangelist-notes: >-
        Spec generated by API Evangelist from published Moondream docs; Moondream
        publishes no OpenAPI. Well-modeled Skill surface, API-key auth, documented
        rate limits, HIPAA/SOC 2 available. Gaps: no status page, no formal
        deprecation policy, no /.well-known discovery, no idempotency contract.
  - target: $.info
    update:
      x-artifact-authentication: authentication/moondream-authentication.yml
      x-artifact-conventions: conventions/moondream-conventions.yml
      x-artifact-errors: errors/moondream-problem-types.yml
      x-artifact-lifecycle: lifecycle/moondream-lifecycle.yml
      x-artifact-packages: packages/moondream-packages.yml
